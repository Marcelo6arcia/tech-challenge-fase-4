name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar o plano desta execução após aprovação aws-dev"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Precisa acompanhar a versao que escreveu o state. O Terraform LE um state
  # gravado por versao mais nova, mas se recusa a GRAVA-LO: com o CI em 1.13.3
  # e o state em 1.15.5, o plan passava e o apply falharia -- e a mensagem so
  # aparece depois da aprovacao manual, no pior momento possivel.
  #
  # Se alguem rodar apply local com uma versao mais nova, o state sobe junto e
  # esta linha precisa subir tambem. O caminho sem essa armadilha e nao aplicar
  # da maquina de ninguem, que e a tese da fase.
  TF_VERSION: "1.15.5"
  AWS_REGION: "us-east-1"
  WORKDIR: "terraform/envs/dev/infra"
  # CIDRs que alcançam o endpoint público da API do EKS. Vem de uma variável de
  # repositório, e não de um arquivo, porque *.tfvars é gitignored e o valor é
  # o IP de quem opera — que muda e não deveria ficar num repositório público.
  # Sem isso, a validação do módulo eks reprova o plan com mensagem explícita,
  # em vez de o EKS aplicar 0.0.0.0/0 sem avisar.
  TF_VAR_public_access_cidrs: ${{ secrets.PUBLIC_ACCESS_CIDRS }}
  # O mesmo bucket que o -backend-config usa, agora tambem como variavel.
  # terraform.tfvars e gitignored, entao no CI state_bucket_name chegava vazio,
  # enable_terraform_plan_access virava false e o plano propunha DESTRUIR a
  # politica que da ao proprio CI permissao de rodar plan. O apply teria
  # quebrado o pipeline de forma permanente, e o erro seguinte (AccessDenied no
  # plan) nao apontaria para a causa.
  TF_VAR_state_bucket_name: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_github_app_repo: ${{ github.event.repository.name }}
  TF_VAR_github_repo_id: ${{ github.repository_id }}

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Qualidade e segurança do código de infraestrutura
  # ---------------------------------------------------------------------------
  static-analysis:
    permissions:
      contents: read
      security-events: write
    name: Lint & Security (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Testar janela e ausência de dados privados no resumo
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validar criptografia do artefato com dados sintéticos
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          test_key=$(head -c 48 /dev/urandom | base64)
          printf 'plano sintético de teste\n' > "$temp_dir/plain"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$temp_dir/cipher" "$temp_dir/plain" <<< "$test_key"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output "$temp_dir/restored" --decrypt "$temp_dir/cipher" <<< "$test_key"
          cmp "$temp_dir/plain" "$temp_dir/restored"

      - name: Validar todos os módulos
        run: |
          set -e
          for dir in terraform/modules/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - name: tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.53.0

      - name: Rodar tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true

      - name: Enviar SARIF do Checkov
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: iac-checkov

      - name: Trivy — misconfiguration no IaC (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: terraform/
          format: table
          severity: CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Plan cloud somente na main e após habilitar a infraestrutura
  # ---------------------------------------------------------------------------
  plan:
    permissions:
      contents: read
      id-token: write
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: static-analysis
    if: vars.INFRA_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Conferir janela autorizada
        env:
          CLOUD_EXPIRES_AT: ${{ vars.CLOUD_EXPIRES_AT }}
        run: python3 .github/scripts/cloud_window.py

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=togglemaster/fase4/infra.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Gerar plano e resumo público sem valores
        working-directory: ${{ env.WORKDIR }}
        run: |
          umask 077
          if ! terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan > plan.txt 2>&1; then
            echo "::error::O plano falhou. Diagnostique no ambiente autorizado; o log bruto não é publicado."
            exit 1
          fi
          terraform show -json tfplan | python3 "$GITHUB_WORKSPACE/.github/scripts/tf_plan_summary.py" >> "$GITHUB_STEP_SUMMARY"

      - name: Criptografar plano antes de arquivar
        working-directory: ${{ env.WORKDIR }}
        env:
          TF_PLAN_KEY: ${{ secrets.TF_PLAN_KEY }}
        run: |
          test "${#TF_PLAN_KEY}" -ge 32
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output tfplan.gpg tfplan <<< "$TF_PLAN_KEY"

      - name: Guardar somente o plano criptografado
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-encrypted-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/tfplan.gpg
          retention-days: 3
          if-no-files-found: error

      - name: Remover plano e log em texto claro
        if: always()
        working-directory: ${{ env.WORKDIR }}
        run: rm -f tfplan plan.txt

  # ---------------------------------------------------------------------------
  # Apply — dispatch explícito, plano criptografado e aprovação aws-dev
  # ---------------------------------------------------------------------------
  apply:
    permissions:
      contents: read
      id-token: write
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main' && vars.INFRA_ENABLED == 'true'
    environment: aws-dev
    steps:
      - uses: actions/checkout@v5

      - name: Conferir janela autorizada
        env:
          CLOUD_EXPIRES_AT: ${{ vars.CLOUD_EXPIRES_AT }}
        run: python3 .github/scripts/cloud_window.py

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: gha-terraform-apply-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=togglemaster/fase4/infra.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Recuperar o plano revisado desta execução
        uses: actions/download-artifact@v7
        with:
          name: tfplan-encrypted-${{ github.run_id }}
          path: ${{ env.WORKDIR }}

      - name: Descriptografar plano desta execução
        working-directory: ${{ env.WORKDIR }}
        env:
          TF_PLAN_KEY: ${{ secrets.TF_PLAN_KEY }}
        run: |
          umask 077
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output tfplan --decrypt tfplan.gpg <<< "$TF_PLAN_KEY"

      - name: Aplicar exatamente o plano desta execução
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Remover plano em texto claro
        if: always()
        working-directory: ${{ env.WORKDIR }}
        run: rm -f tfplan
