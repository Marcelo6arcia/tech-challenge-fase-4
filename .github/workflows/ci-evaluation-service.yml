# Pipeline DevSecOps do evaluation-service.
# A lógica vive em _reusable-ci.yml — aqui ficam apenas os gatilhos e os inputs.
name: CI evaluation-service

on:
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/ci-evaluation-service.yml"
      - ".github/workflows/_reusable-ci.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/ci-evaluation-service.yml"
      - ".github/workflows/_reusable-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-evaluation-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      service: evaluation-service
      language: go
      gitops_repo: ${{ vars.GITOPS_REPO }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GITOPS_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}
