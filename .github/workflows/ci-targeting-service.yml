# Pipeline DevSecOps do targeting-service.
# A lógica vive em _reusable-ci.yml — aqui ficam apenas os gatilhos e os inputs.
name: CI targeting-service

on:
  push:
    branches: [main]
    paths:
      - "targeting-service/**"
      - ".github/workflows/ci-targeting-service.yml"
      - ".github/workflows/_reusable-ci.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "targeting-service/**"
      - ".github/workflows/ci-targeting-service.yml"
      - ".github/workflows/_reusable-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-targeting-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      service: targeting-service
      language: python
      gitops_repo: ${{ vars.GITOPS_REPO }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GITOPS_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}
